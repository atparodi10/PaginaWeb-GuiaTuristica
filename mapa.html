<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Mapa de Tokio — Guía Turística</title>

    <!-- Fuentes y Leaflet -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root{
            --bg:#0f1720;        /* fondo general */
            --card:#0b1320;      /* tarjeta/mapa */
            --accent:#ff7a18;    /* acento cálido */
            --muted:#9aa6b2;     /* texto secundario */
        }
        *{box-sizing:border-box}
        body{
            margin:0;
            font-family:'Poppins',system-ui,Segoe UI,Roboto,"Helvetica Neue",Arial;
            background: linear-gradient(180deg,var(--bg), #071018 120%);
            color:#e6eef6;
            -webkit-font-smoothing:antialiased;
        }

        /* Navbar */
        nav{
            display:flex;
            gap:16px;
            align-items:center;
            justify-content:space-between;
            padding:14px 20px;
            background: linear-gradient(90deg, rgba(10,12,16,0.6), rgba(14,20,28,0.6));
            border-bottom: 1px solid rgba(255,255,255,0.03);
            backdrop-filter: blur(6px);
        }
        .brand{
            display:flex;
            align-items:center;
            gap:12px;
        }
        .logo{
            width:42px;height:42px;border-radius:10px;
            background:linear-gradient(135deg,var(--accent),#ffcc33);
            display:inline-block;
            box-shadow:0 6px 18px rgba(0,0,0,0.5);
        }
        nav a{
            color:var(--muted);
            text-decoration:none;
            padding:8px 12px;
            border-radius:8px;
            font-weight:500;
            transition:all .18s ease;
        }
        nav a:hover{ color:#fff; background:rgba(255,255,255,0.03) }

        /* Layout */
        main{ max-width:1100px; margin:28px auto; padding:0 18px; }
        header{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:20px;
            margin-bottom:18px;
        }
        h1{
            margin:0;
            font-size:1.6rem;
            letter-spacing:0.2px;
        }
        .subtitle{ color:var(--muted); font-size:0.95rem; margin-top:6px }

        /* Card que contiene el mapa */
        .card{
            background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
            border-radius:14px;
            padding:14px;
            box-shadow: 0 8px 30px rgba(2,6,12,0.6);
            border: 1px solid rgba(255,255,255,0.03);
        }
        .map-wrap{ height:560px; border-radius:10px; overflow:hidden; border:1px solid rgba(255,255,255,0.03) }

        /* Control panel (en español) */
        .controls{
            display:flex;
            gap:10px;
            align-items:center;
            flex-wrap:wrap;
        }
        .btn{
            background:linear-gradient(90deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));
            color:#fff;
            padding:7px 12px;
            border-radius:10px;
            border:1px solid rgba(255,255,255,0.04);
            cursor:pointer;
            font-weight:600;
            font-size:.93rem;
        }
        .btn.secondary{ color:var(--muted); background:transparent; border:1px dashed rgba(255,255,255,0.03) }
        .legend{ color:var(--muted); font-size:.9rem; padding-left:8px }

        /* Mobile */
        @media (max-width:700px){
            .map-wrap{ height:420px }
            header{ flex-direction:column; align-items:flex-start; gap:8px }
        }

        /* Leaflet popups / controls contrast adjustments */
        .leaflet-control-layers, .leaflet-control-zoom, .leaflet-control-attribution {
            background: rgba(6,8,10,0.6);
            color: #e6eef6 !important;
            border-radius:8px;
            border:0;
            box-shadow: 0 6px 18px rgba(0,0,0,0.45);
        }
        .leaflet-popup-content-wrapper{
            background: linear-gradient(180deg,#071021,#09151f);
            color:#e6eef6;
            border-radius:10px;
            box-shadow:0 10px 30px rgba(0,0,0,0.6);
        }
        .leaflet-popup-tip{
            background: linear-gradient(180deg,#071021,#09151f);
        }
    </style>
</head>
<body>
    <nav>
        <div class="brand">
            <div class="logo" aria-hidden="true"></div>
            <div>
                <div style="font-weight:700">Guía Tokio</div>
                <div style="font-size:.8rem; color:var(--muted)">Turismo · Mapas · Recomendaciones</div>
            </div>
        </div>

        <div style="display:flex;gap:8px;align-items:center">
            <a href="index.html" aria-label="Inicio">Inicio</a>
            <a href="historia.html" aria-label="Historia">Historia</a>
            <a href="gastronomia.html" aria-label="Galería">Gastronomía</a>
            <a href="lugares.html" aria-label="Lugares turísticos">Lugares</a>
            <a href="mapa.html" aria-label="Mapa">Mapa</a>
        </div>
    </nav>

    <main>
        <header>
            <div>
                <h1>Mapa interactivo de Tokio</h1>
                <div class="subtitle">Colores oscuros, estilo turístico. Contenido en español.</div>
            </div>

            <div class="controls">
                <button id="toggleLayer" class="btn" title="Cambiar capa">Modo claro / oscuro</button>
                <button id="zoomTo" class="btn secondary" title="Centrar en Tokio">Centrar en Tokio</button>
                <div class="legend">Sugerencias: pulsa un marcador para ver detalles.</div>
            </div>
        </header>

        <section class="card">
            <div id="map" class="map-wrap" role="region" aria-label="Mapa de Tokio"></div>
            <div style="margin-top:12px;color:var(--muted);font-size:.9rem">
                Mapa: datos © OpenStreetMap contribuyentes — Interfaz en español.
            </div>
        </section>
    </main>

    <!-- Scripts: Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Centro en Tokio (lat, lon)
        const tokio = [35.6895, 139.6917];

        // Inicializar mapa
        const map = L.map('map', { center: tokio, zoom: 13, zoomControl: false });

        // Capas: oscuro (CartoDB Dark) y claro (OpenStreetMap)
        const dark = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: 'Mapa © <a href="https://www.openstreetmap.org/">OpenStreetMap</a> — CartoDB',
            maxNativeZoom: 19
        });

        const light = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: 'Mapa © <a href="https://www.openstreetmap.org/">OpenStreetMap</a>',
            maxNativeZoom: 19
        });

        // Empezar con oscuro
        dark.addTo(map);

        // Controles de Leaflet (mejor contraste para tema oscuro)
        L.control.zoom({ position: 'topright' }).addTo(map);
        L.control.scale({ metric: true, imperial: false }).addTo(map);

        // Marcadores turísticos con textos en español
        const lugares = [
            { coords:[35.7100,139.8107], title:'Tokyo Skytree', desc:'Torre y mirador con vistas panorámicas.' },
            { coords:[35.6586,139.7454], title:'Torre de Tokio', desc:'Emblema de la ciudad con vistas y zonas verdes.' },
            { coords:[35.6764,139.6993], title:'Parque Ueno', desc:'Museos, zoo y cerezos en primavera.' },
            { coords:[35.6895,139.6917], title:'Shinjuku', desc:'Centro moderno con rascacielos y vida nocturna.' },
            { coords:[35.6938,139.7034], title:'Meiji Jingu', desc:'Santuario sintoísta en un bosque tranquilo.' }
        ];

        // Icono personalizado (sencillo)
        const icon = L.divIcon({
            className: 'custom-marker',
            html: `<svg width="26" height="34" viewBox="0 0 24 34" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 0C7 0 3 4 3 9c0 7 9 19 9 19s9-12 9-19c0-5-4-9-9-9z" fill="#ff7a18"/>
                    <circle cx="12" cy="9" r="3.4" fill="#fff"/>
                  </svg>`,
            iconSize: [26,34],
            iconAnchor: [13,34],
            popupAnchor: [0,-30]
        });

        lugares.forEach(l => {
            L.marker(l.coords, { icon }).addTo(map)
                .bindPopup(`<strong>${l.title}</strong><br><small style="color:#c8d6df">${l.desc}</small>`);
        });

        // Botones externos
        document.getElementById('toggleLayer').addEventListener('click', () => {
            if (map.hasLayer(dark)) {
                map.removeLayer(dark);
                light.addTo(map);
                document.getElementById('toggleLayer').textContent = 'Modo oscuro / claro';
            } else {
                map.removeLayer(light);
                dark.addTo(map);
                document.getElementById('toggleLayer').textContent = 'Modo claro / oscuro';
            }
        });

        document.getElementById('zoomTo').addEventListener('click', () => {
            map.setView(tokio, 13, { animate:true, duration:0.7 });
        });

        // Mejora: abrir popup del marcador más cercano al centro
        function abrirMasCercano() {
            let minDist = Infinity, nearest = null;
            lugares.forEach(l => {
                const d = map.distance(map.getCenter(), L.latLng(l.coords));
                if (d < minDist) { minDist = d; nearest = l; }
            });
            if (!nearest) return;
            // buscar marker y abrir popup
            map.eachLayer(layer => {
                if (layer.getLatLng && layer.getLatLng().equals(L.latLng(nearest.coords))) {
                    layer.openPopup();
                }
            });
        }
        // Abrir al cargar
        setTimeout(abrirMasCercano, 700);

        // Ajustes para accesibilidad: atajos de teclado
        window.addEventListener('keydown', (e) => {
            if (e.key === 'm') { // 'm' para centrar en Tokio
                map.setView(tokio, 13, { animate:true });
            }
        });
    </script>
</body>
</html>
